services:
  - type: web
    name: finance-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: NEW_BOT_TOKEN
        sync: false
      - key: MIGRATION_SECRET
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DDS_OCR_ENABLED
        value: "true"
      - key: DDS_OCR_MODE
        value: shadow
